# Contoh konfigurasi Locally-Managed Cloudflare Tunnel (Cara B).
# Salin ke ~/.cloudflared/config.yml lalu isi CLOUDFLARE_CONFIG_PATH di .env.
tunnel: <UUID-TUNNEL-ANDA>
credentials-file: /home/ubuntu/.cloudflared/<UUID-TUNNEL-ANDA>.json

originRequest:
  connectTimeout: 30s
  tlsTimeout: 10s
  tcpKeepAlive: 30s
  keepAliveConnections: 100
  keepAliveTimeout: 90s
  disableChunkedEncoding: false
  http2Origin: false

ingress:
  - hostname: ai.domainanda.com
    service: http://127.0.0.1:8000
  - service: http_status:404
